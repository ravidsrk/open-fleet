server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: target-app
    static_configs:
      - targets:
          - localhost
        labels:
          job: target-app
          service: app
          __path__: /var/log/target-app/app.log
      - targets:
          - localhost
        labels:
          job: target-app
          service: staging
          __path__: /var/log/target-app/staging.log
