[project]
name = "target-app"
version = "0.1.0"
description = "Fixture target app for open-fleet mission runs (ship-it fixture build)."
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.16",
  "fastapi>=0.116",
  "jinja2>=3.1",
  "prometheus-client>=0.26.0",
  "python-multipart>=0.0.18",
  "sqlalchemy>=2.0",
  "structlog>=26.1.0",
  "uvicorn>=0.35",
]

[dependency-groups]
dev = [
  "httpx>=0.28",
  "pytest>=8.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
