name: release-engine

on:
  push:
    tags:
      - "engine-v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: open-fleet-linux-x64
            ext: ""
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: open-fleet-linux-arm64
            ext: ""
          - os: macos-15
            target: aarch64-apple-darwin
            asset: open-fleet-darwin-arm64
            ext: ""
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset: open-fleet-darwin-x64
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: open-fleet-windows-x64.exe
            ext: ".exe"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build release binary
        env:
          TARGET: ${{ matrix.target }}
          ASSET: ${{ matrix.asset }}
          EXT: ${{ matrix.ext }}
        shell: bash
        run: |
          set -euo pipefail
          rustup target add "$TARGET"
          cargo build --release --locked --target "$TARGET" -p of-cli
          mkdir -p dist
          cp "target/$TARGET/release/open-fleet$EXT" "dist/$ASSET"
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "$ASSET" > "$ASSET.sha256")
          else
            (cd dist && shasum -a 256 "$ASSET" > "$ASSET.sha256")
          fi
          cat "dist/$ASSET.sha256"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: engine-${{ matrix.asset }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    if: startsWith(github.ref, 'refs/tags/engine-v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: dist
          merge-multiple: true
      - name: Generate Homebrew formula (open-fleet.rb)
        env:
          TAG_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d ' \t\r\n' < ENGINE_VERSION)"
          SHA_DARWIN_ARM64="$(awk '{print $1}' dist/open-fleet-darwin-arm64.sha256)"
          SHA_DARWIN_X64="$(awk '{print $1}' dist/open-fleet-darwin-x64.sha256)"
          SHA_LINUX_ARM64="$(awk '{print $1}' dist/open-fleet-linux-arm64.sha256)"
          SHA_LINUX_X64="$(awk '{print $1}' dist/open-fleet-linux-x64.sha256)"
          sed 's/^          //' > dist/open-fleet.rb <<EOF
          class OpenFleet < Formula
            desc "The proof layer and autonomous fleet engine for coding agents"
            homepage "https://github.com/${REPO}"
            version "${VERSION}"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/${REPO}/releases/download/${TAG_NAME}/open-fleet-darwin-arm64"
                sha256 "${SHA_DARWIN_ARM64}"
              else
                url "https://github.com/${REPO}/releases/download/${TAG_NAME}/open-fleet-darwin-x64"
                sha256 "${SHA_DARWIN_X64}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "https://github.com/${REPO}/releases/download/${TAG_NAME}/open-fleet-linux-arm64"
                sha256 "${SHA_LINUX_ARM64}"
              else
                url "https://github.com/${REPO}/releases/download/${TAG_NAME}/open-fleet-linux-x64"
                sha256 "${SHA_LINUX_X64}"
              end
            end

            def install
              bin.install Dir["open-fleet-*"].first => "open-fleet"
            end

            test do
              assert_match "open-fleet ${VERSION}", shell_output("#{bin}/open-fleet --version")
            end
          end
          EOF
          cat dist/open-fleet.rb
      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d ' \t\r\n' < ENGINE_VERSION)"
          if [ "$TAG_NAME" != "engine-v$VERSION" ]; then
            echo "::error::tag $TAG_NAME does not match ENGINE_VERSION ($VERSION)"
            exit 1
          fi
          ls -la dist/
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" dist/* --clobber
          else
            gh release create "$TAG_NAME" dist/* --title "open-fleet engine v$VERSION" --generate-notes
          fi

  publish-npm:
    if: startsWith(github.ref, 'refs/tags/engine-v')
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: dist
          merge-multiple: true
      - name: Publish @open-fleet/cli and platform packages (when NPM_TOKEN is set)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN secret not configured; skipping npm publish cleanly."
            exit 0
          fi
          printf '//registry.npmjs.org/:_authToken=%s\n' "${NODE_AUTH_TOKEN}" > .npmrc
          chmod 600 .npmrc
          trap 'rm -f .npmrc' EXIT
          for plat in darwin-arm64 darwin-x64 linux-arm64 linux-x64 windows-x64; do
            ext=""
            if [ "$plat" = "windows-x64" ]; then
              ext=".exe"
            fi
            pkg_dir="cli/platform-packages/${plat}"
            mkdir -p "${pkg_dir}/bin"
            cp "dist/open-fleet-${plat}${ext}" "${pkg_dir}/bin/open-fleet${ext}"
            chmod 755 "${pkg_dir}/bin/open-fleet${ext}"
            npm publish "${pkg_dir}" --access public --userconfig "$PWD/.npmrc"
          done
          npm publish cli --access public --userconfig "$PWD/.npmrc"
