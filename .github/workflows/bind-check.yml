name: bind-check

on:
  pull_request:
    paths:
      - "docs/runs/**"
      - "docs/reports/**"

permissions:
  contents: read

jobs:
  bind:
    runs-on: codebuild-gha-open-fleet-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 15
    steps:
      # The PR's tree goes in its own directory, beside the base checkout rather than above it:
      # a nested checkout is an untracked path to the tools that diff the tree (PR #707 review).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24; Node 20 left runners 2026-09-23, #367)
        with:
          persist-credentials: false
          path: pr
          fetch-depth: 0  # the binder re-hashes at the report's pinned commit, not at the tip
      # The binder comes from the BASE sha, into its own path (as verdict-check.yml does): a PR
      # that submits a report also carries its own copy of run_report.py, which could grade that
      # report lenient (2026-10-26 review). The PR's tree is still what gets bound.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24; Node 20 left runners 2026-09-23, #367)
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base-checker
          sparse-checkout: |
            scripts
            runtime/scripts
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 (Node 24, #367)
        with:
          python-version: "3.13"  # pin: CI 3.x was a moving target (G-03)
      - name: register setup-python's libpython with ldconfig (CodeBuild runners)
        # Subprocesses that drop LD_LIBRARY_PATH otherwise fail to load libpython.
        run: |
          if [ -n "${pythonLocation:-}" ] && [ -d "$pythonLocation/lib" ]; then
            SUDO=""; [ "$(id -u)" = 0 ] || SUDO=sudo
            echo "$pythonLocation/lib" | $SUDO tee /etc/ld.so.conf.d/zz-setup-python.conf >/dev/null
            $SUDO ldconfig
          fi
      - name: Bind-check submitted run reports
        # #415: submission PRs (bundle first, promotion later) are invisible
        # to validate.yml's bare run_report.py, which only checks missions
        # that already claim a tier. This routes every added/modified
        # candidate report to the binder and fails with the binder's output.
        # The ref reaches the shell through env (as guard.yml does), never
        # interpolated into the script text: a branch name is attacker-shaped.
        env:
          BIND_BASE_REF: ${{ github.base_ref }}
        run: python3 base-checker/scripts/bind_check.py --root "$GITHUB_WORKSPACE/pr" --base "origin/$BIND_BASE_REF"
