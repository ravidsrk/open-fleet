name: upstream-drift

# Weekly drift probe against the Orca pin. Upstream (stablyai/orca) cuts about a
# release a day and this catalog re-pins quarterly (runtime/orca-pin.md), so between
# re-pins nothing said how far runtime/pins.json had fallen behind — the first
# warning was a field sighting. `upstream_probe.py latest` lists upstream's stable
# tags through the GitHub API (network only, no binary) and exits 3 when a re-pin is
# due (a minor or major moved, or ten or more stable tags sit above the pin), 0 when
# it is not, 2 when it could not tell. Exit 3 opens — or comments on — an issue
# labeled `upstream-drift`, so the signal reaches the maintainer through ordinary
# issue notifications (the alert-on-failure path, #213); anything but 0 or 3 fails
# the job, because a probe that could not look must not read as "nothing moved".
# `upstream_probe.py review-date` is the dated quarterly trigger (#508): it reads
# `orca.next_review` from runtime/pins.json and exits 3 on or after that date, which
# files the same issue — so no standing issue per cadence has to carry the date.
# The two checks are independent, so neither may silence the other (#661 review): the
# alert steps run under `!cancelled()` — GitHub otherwise adds `success()` to a condition
# that names no status function, and an earlier failed step skipped a confirmed alert —
# the issue is built from whichever check answered, and the failure steps come LAST, so
# a check that could not run still fails the job after every confirmed alert is filed.
# Uses only the runner's preinstalled `gh` and `jq` — no third-party actions beyond
# the pinned checkout and setup-python. `workflow_dispatch` runs the same path by
# hand: on a current pin it writes the one-line summary and files nothing.

on:
  schedule:
    - cron: '17 6 * * 1'  # Mondays 06:17 UTC — off the hour, where the cron queue piles up
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: codebuild-gha-open-fleet-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24; Node 20 left runners 2026-09-23, #367)
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 (Node 24, #367)
        with:
          python-version: "3.13"  # pin: CI 3.x was a moving target (G-03)
      - name: register setup-python's libpython with ldconfig (CodeBuild runners)
        # Subprocesses that drop LD_LIBRARY_PATH otherwise fail to load libpython.
        run: |
          if [ -n "${pythonLocation:-}" ] && [ -d "$pythonLocation/lib" ]; then
            SUDO=""; [ "$(id -u)" = 0 ] || SUDO=sudo
            echo "$pythonLocation/lib" | $SUDO tee /etc/ld.so.conf.d/zz-setup-python.conf >/dev/null
            $SUDO ldconfig
          fi

      - name: Probe upstream tags against the pin
        id: probe
        # The tags endpoint is public; the token only lifts the API rate limit that
        # shared runner IPs exhaust. `|| code=$?` keeps the runner's `-e` from aborting
        # on exit 3, which is a verdict, not a failure. Outputs go through
        # $GITHUB_OUTPUT so later steps read them from env, never from an inline
        # expression (a script-injection hole, PR #468 review).
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          code=0
          python3 runtime/scripts/upstream_probe.py latest --json > "${RUNNER_TEMP}/probe.json" || code=$?
          cat "${RUNNER_TEMP}/probe.json"
          echo "code=${code}" >> "$GITHUB_OUTPUT"
          if [ "${code}" -eq 0 ] || [ "${code}" -eq 3 ]; then
            for key in pin latest drift patches_behind; do
              echo "${key}=$(jq -r ".${key}" "${RUNNER_TEMP}/probe.json")" >> "$GITHUB_OUTPUT"
            done
          fi

      - name: Check the pin's dated review trigger
        id: review
        # No network: compares today's UTC date with orca.next_review (#508).
        run: |
          code=0
          python3 runtime/scripts/upstream_probe.py review-date --json > "${RUNNER_TEMP}/review.json" || code=$?
          cat "${RUNNER_TEMP}/review.json"
          echo "code=${code}" >> "$GITHUB_OUTPUT"
          if [ "${code}" -eq 0 ] || [ "${code}" -eq 3 ]; then
            for key in pin next_review days_left; do
              echo "${key}=$(jq -r ".${key}" "${RUNNER_TEMP}/review.json")" >> "$GITHUB_OUTPUT"
            done
          fi

      - name: Ensure the upstream-drift label exists
        if: ${{ !cancelled() && (steps.probe.outputs.code == '3' || steps.review.outputs.code == '3') }}
        run: >-
          gh label create upstream-drift --force --color FBCA04
          --description "upstream Orca moved past runtime/pins.json (filed by the upstream-drift workflow)"

      - name: Open or update the drift issue
        if: ${{ !cancelled() && (steps.probe.outputs.code == '3' || steps.review.outputs.code == '3') }}
        id: drift
        env:
          # Either check names the pin; a date-only alert must not depend on `latest` answering.
          PIN: ${{ steps.probe.outputs.pin || steps.review.outputs.pin }}
          LATEST: ${{ steps.probe.outputs.latest }}
          DRIFT: ${{ steps.probe.outputs.drift }}
          PATCHES_BEHIND: ${{ steps.probe.outputs.patches_behind }}
          PROBE_CODE: ${{ steps.probe.outputs.code }}
          REVIEW_CODE: ${{ steps.review.outputs.code }}
          NEXT_REVIEW: ${{ steps.review.outputs.next_review }}
        run: |
          # A date-only trigger must not claim upstream moved: the title names what fired.
          if [ "${PROBE_CODE}" = "3" ]; then
            title="Orca moved past the pin: ${LATEST} vs ${PIN}"
          else
            title="Orca pin review date reached: ${NEXT_REVIEW} (pin ${PIN})"
          fi
          # Each line states only what its own check answered; a check that could not run says so.
          upstream="Upstream \`stablyai/orca\` is at **${LATEST}**; \`runtime/pins.json\` pins **${PIN}** — \`${DRIFT}\` drift, ${PATCHES_BEHIND} stable tag(s) newer than the pin."
          if [ "${PROBE_CODE}" != "0" ] && [ "${PROBE_CODE}" != "3" ]; then
            upstream="The upstream tag check could not run (exit ${PROBE_CODE}), so this run cannot say whether upstream moved past **${PIN}** — see the probe step."
          fi
          dated="The dated review trigger (\`orca.next_review\` ${NEXT_REVIEW}) has not been reached."
          if [ "${REVIEW_CODE}" = "3" ]; then
            dated="The dated review trigger \`orca.next_review\` **${NEXT_REVIEW}** has been reached: the quarterly re-pin is due whatever upstream did."
          elif [ "${REVIEW_CODE}" != "0" ]; then
            dated="The dated review check could not run (exit ${REVIEW_CODE}): \`orca.next_review\` was not read — see the review step."
          fi
          pin_record="https://github.com/${GH_REPO}/blob/main/runtime/orca-pin.md"
          body="$(printf '%s\n' \
            "${upstream}" \
            "${dated}" \
            "" \
            "- Probe run: ${RUN_URL}" \
            "- Re-pin: run the \`pin-it\` mission (cadence and steps: ${pin_record})" \
            "- With a binary at hand: \`runtime/scripts/upstream_probe.py capture --out <dir>\`, then \`diff --baseline <the receipts directory the pin record names> --fresh <dir>\`" \
            "" \
            "Filed by the \`upstream-drift\` workflow. Close it when the pin is re-witnessed past every trigger named above.")"
          existing="$(gh issue list --label upstream-drift --state open --json number --jq '.[0].number // empty')"
          if [ -n "${existing}" ]; then
            gh issue edit "${existing}" --title "${title}" > /dev/null
            gh issue comment "${existing}" --body "${body}" > /dev/null
            number="${existing}"
            action="commented"
          else
            number="$(gh issue create --title "${title}" --label upstream-drift --body "${body}" | grep -oE '[0-9]+$')"
            action="created"
          fi
          echo "number=${number}" >> "$GITHUB_OUTPUT"
          echo "action=${action}" >> "$GITHUB_OUTPUT"
          checks="latest exit ${PROBE_CODE}"
          if [ "${PROBE_CODE}" = "0" ] || [ "${PROBE_CODE}" = "3" ]; then
            checks="${checks} (\`${DRIFT}\` drift, ${PIN} → ${LATEST})"
          fi
          checks="${checks}; review-date exit ${REVIEW_CODE}"
          if [ "${REVIEW_CODE}" = "0" ] || [ "${REVIEW_CODE}" = "3" ]; then
            checks="${checks} (dated review ${NEXT_REVIEW})"
          fi
          {
            echo "## upstream-drift"
            echo ""
            echo "- verdict: re-pin due — ${checks}"
            echo "- issue: https://github.com/${GH_REPO}/issues/${number} (${action})"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summary
        if: ${{ !cancelled() && steps.probe.outputs.code == '0' && steps.review.outputs.code == '0' }}
        env:
          PIN: ${{ steps.probe.outputs.pin }}
          LATEST: ${{ steps.probe.outputs.latest }}
          DRIFT: ${{ steps.probe.outputs.drift }}
          PATCHES_BEHIND: ${{ steps.probe.outputs.patches_behind }}
          NEXT_REVIEW: ${{ steps.review.outputs.next_review }}
          DAYS_LEFT: ${{ steps.review.outputs.days_left }}
        run: >-
          echo "upstream-drift: pin ${PIN}, upstream ${LATEST}, \`${DRIFT}\` drift, ${PATCHES_BEHIND} stable tag(s) newer than the pin; dated review ${NEXT_REVIEW} in ${DAYS_LEFT} day(s) — no re-pin due"
          >> "$GITHUB_STEP_SUMMARY"

      - name: Fail when the probe could not run
        if: ${{ !cancelled() && steps.probe.outputs.code != '0' && steps.probe.outputs.code != '3' }}
        env:
          CODE: ${{ steps.probe.outputs.code }}
        run: |
          echo "::error::upstream_probe.py exited ${CODE} — it could not tell whether upstream moved (see the probe step)"
          exit 1

      - name: Fail when the review-date check could not run
        if: ${{ !cancelled() && steps.review.outputs.code != '0' && steps.review.outputs.code != '3' }}
        env:
          CODE: ${{ steps.review.outputs.code }}
        run: |
          echo "::error::upstream_probe.py review-date exited ${CODE} — it could not read orca.next_review from runtime/pins.json (see the review step)"
          exit 1
