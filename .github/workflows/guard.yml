# Floor guard (floor-it GUARD): the bar cannot be lowered quietly.
#
# runtime/scripts/floor_guard.py diffs the PR against its base and fails on the
# six moves that lower the bar without touching a stated requirement: a silenced
# checker, a test made easier, unfinished work left as a stub, an assertion
# deleted from a test that stayed, a threshold walked down in CONSTRAINTS.md (or
# a new exception row), and a touch to the frozen guard surface (.gitleaksignore,
# .gitleaks.toml, the ruff rule selection and its exclusions, ROUTING_MIN_SCORE, evals/routing.json,
# the vf-bench corpus + pins, the .coveragerc fail_under and scope). Each fails without a recorded DECISIONS
# waiver whose id is `floor-waiver:<rule>:<path>` and whose answer is `allow`.
# The waiver is read from the BASE ref's docs/DECISIONS.md (the PR cannot
# write its own) and grants only as a one-way human grant, signed when the
# base pins .orca/human-grant-pubkey (2026-10-23 review, #621): land it on the
# base branch before the PR that needs it.
#
# PR-only: on a push there is no base to diff, so there is nothing to guard.
name: floor-guard

on:
  pull_request:

permissions:
  contents: read

jobs:
  guard:
    runs-on: codebuild-gha-open-fleet-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 15
    steps:
      # The PR's tree goes in its own directory: a second checkout nested inside the scanned tree
      # is an untracked path the guard diffs, and `git diff --no-index` refuses a directory, so
      # the guard exited `could not run` before reading the PR (PR #707 review).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24; Node 20 left runners 2026-09-23, #367)
        with:
          persist-credentials: false
          path: pr
          fetch-depth: 0  # the guard diffs the merge base, not a depth-1 tip
      # The checker comes from the BASE sha, into its own path (as verdict-check.yml does): the
      # PR's own copy of floor_guard.py is part of what is under review, so a PR that narrowed
      # the guard surface or blinded a rule would have graded itself clean (2026-10-26 review).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24; Node 20 left runners 2026-09-23, #367)
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base-checker
          sparse-checkout: runtime/scripts
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 (Node 24, #367)
        with:
          python-version: "3.13"  # pin: CI 3.x was a moving target (G-03)
      - name: register setup-python's libpython with ldconfig (CodeBuild runners)
        # Subprocesses that drop LD_LIBRARY_PATH otherwise fail to load libpython.
        run: |
          if [ -n "${pythonLocation:-}" ] && [ -d "$pythonLocation/lib" ]; then
            SUDO=""; [ "$(id -u)" = 0 ] || SUDO=sudo
            echo "$pythonLocation/lib" | $SUDO tee /etc/ld.so.conf.d/zz-setup-python.conf >/dev/null
            $SUDO ldconfig
          fi
      - name: No quiet bar-lowering (guard-surface + checker hygiene)
        # Same base convention as bind-check.yml: the PR's own base. Via env,
        # quoted: a base branch name is attacker-influenced input (any branch
        # can be a PR target) and `${{ }}` interpolates before the shell runs,
        # so an unquoted inline expansion is a script-injection hole (PR #468
        # review, P1). An env var is expanded by the runner, never re-parsed.
        env:
          GUARD_BASE_REF: ${{ github.base_ref }}
        run: python3 base-checker/runtime/scripts/floor_guard.py --repo "$GITHUB_WORKSPACE/pr" --base "origin/${GUARD_BASE_REF}"
