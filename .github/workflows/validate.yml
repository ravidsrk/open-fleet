name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    # The contract suite, sharded across six parallel jobs (speed-it J1
    # sharding: the ~670 s sequential suite (2026-10-14) is diffuse fan-out no
    # hotspot fix removes, so CI fans out instead). scripts/shard-tests.py owns
    # the partition — LPT over modules, with the few modules whose weight file
    # records class weights split one unit per TestCase class (test_wip_curve
    # alone was a 640-745 s shard), unittest stays the runner, stdlib only —
    # and tests/test_shard_tests.py proves the union of the shards equals live
    # discovery, test ID by test ID. fail-fast false: a red shard must not hide
    # the other five.
    # `gates` below NEEDS this job and runs `if: always()`, and its first step
    # fails unless every need succeeded: branch protection requires the `gates`
    # context, and a need that fails SKIPS a plain dependent, which GitHub counts
    # as a passing required check (2026-10-23 review, P1-5).
    runs-on: ubuntu-latest  # needs non-root + system-custody git; stays GitHub-hosted
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24; Node 20 left runners 2026-09-23, #367)
        with:
          persist-credentials: false
          fetch-depth: 0  # same full-history checkout the suite ran under in gates
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 (Node 24, #367)
        with:
          python-version: "3.13"  # pin: CI 3.x was a moving target (G-03)
      - name: register setup-python's libpython with ldconfig (CodeBuild runners)
        # Subprocesses that drop LD_LIBRARY_PATH otherwise fail to load libpython.
        run: |
          if [ -n "${pythonLocation:-}" ] && [ -d "$pythonLocation/lib" ]; then
            SUDO=""; [ "$(id -u)" = 0 ] || SUDO=sudo
            echo "$pythonLocation/lib" | $SUDO tee /etc/ld.so.conf.d/zz-setup-python.conf >/dev/null
            $SUDO ldconfig
          fi
      - name: Install coverage from the hashed lock
        # Same lock + --require-hashes shape as gates (#301): each matrix job
        # traces its own shard, so each needs the pinned tracer. The whole
        # lock installs (not coverage alone) — one install shape, no second
        # resolution path for a tool to slip through.
        run: |
          set -euo pipefail
          python3 -I -m pip install --quiet --require-hashes --only-binary :all: \
            -r .github/ci-tools.lock
          coverage --version
      - name: Suite runs as a non-root user
        # test_verify / test_verify_gate SKIP their ownership-boundary tests under euid 0
        # (root owns every path by definition). GitHub-hosted runners run as `runner`, so CI
        # exercises them; this step keeps it that way if the runner image ever changes.
        run: |
          if [ "$(id -u)" -eq 0 ]; then
            echo "::error::the suite is running as root: ownership-boundary tests would skip silently"
            exit 1
          fi
      - name: Run suite shard without Gitleaks
        env:
          # Every expression reaches a script through env:, never inline (2026-10-23 review, §5 CI).
          SHARD: ${{ matrix.shard }}
        run: |
          if command -v gitleaks >/dev/null; then
            echo "::error::the scanner-absent test environment unexpectedly contains Gitleaks"
            exit 1
          fi
          # The data file goes to the runner's temp dir, not the PR's tree (2026-10-27 security
          # audit, W6-02): a `.coverage.*` glob over the checkout uploaded any data file a test
          # saved there, and the combine in gates read it.
          mkdir -p "$RUNNER_TEMP/coverage-data"
          export COVERAGE_FILE="$RUNNER_TEMP/coverage-data/shard"
          python3 scripts/shard-tests.py --shard "$SHARD" --of 6 --with-coverage
      - name: Name the shard's one coverage data file
        # --parallel-mode writes shard.<host>.<pid>.<random>; exactly one process ran under the
        # tracer, so exactly one file is expected, and it is uploaded under one exact name.
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          found=("$RUNNER_TEMP"/coverage-data/shard.*)
          if [ "${#found[@]}" -ne 1 ]; then
            echo "::error::shard $SHARD left ${#found[@]} coverage data files, not one; the D9 floor reads exactly one per shard"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/coverage-upload"
          mv "${found[0]}" "$RUNNER_TEMP/coverage-upload/coverage-shard-$SHARD.data"
      - name: Upload the shard coverage data
        # gates downloads all six and combines before the D9 report. No if:always: a red shard
        # uploads nothing; gates still runs and its first step fails on the red need, so the
        # combine never runs short. One exact file, no glob and no hidden files (W6-02).
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0 (Node 24, #367; v4/v5 are Node 20, gone from runners 2026-09-23)
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/coverage-upload/coverage-shard-${{ matrix.shard }}.data
          if-no-files-found: error
          retention-days: 1
  floor:
    # #514: the Python floor is a measured claim, not an installer setting. The sharded `tests`
    # job above proves 3.13 (the CI pin, and the job that carries the D9 coverage data); this
    # matrix proves the floor and the minor between it and the pin. Same shards, same runner, no
    # artifacts; `gates` needs it so a red floor blocks the merge.
    runs-on: ubuntu-latest  # needs non-root + system-custody git
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24; same pin as the tests job)
        with:
          persist-credentials: false
          fetch-depth: 0  # same full-history checkout the suite ran under in gates
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 (Node 24, #367)
        with:
          python-version: ${{ matrix.python }}
      - name: register setup-python's libpython with ldconfig (CodeBuild runners)
        # Subprocesses that drop LD_LIBRARY_PATH otherwise fail to load libpython.
        run: |
          if [ -n "${pythonLocation:-}" ] && [ -d "$pythonLocation/lib" ]; then
            SUDO=""; [ "$(id -u)" = 0 ] || SUDO=sudo
            echo "$pythonLocation/lib" | $SUDO tee /etc/ld.so.conf.d/zz-setup-python.conf >/dev/null
            $SUDO ldconfig
          fi
      - name: Install coverage from the hashed lock
        run: |
          set -euo pipefail
          python3 -I -m pip install --quiet --require-hashes --only-binary :all: \
            -r .github/ci-tools.lock
          coverage --version
      - name: Run suite shard on the floor interpreter
        # Same invocation as the 3.13 matrix, coverage included: tests/test_shard_tests.py's
        # test_ci_shard_invocation_collects_coverage requires --with-coverage on EVERY shard
        # invocation in this file, so dropping it here waits on a recorded waiver for that
        # assertion. The data files are not uploaded — the D9 gate reads the 3.13 matrix, this
        # lane proves the floor.
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          python3 --version
          python3 scripts/shard-tests.py --shard "$SHARD" --of 6 --with-coverage
  checks:
    # Every repository gate that needs nothing the shards produce, started at t=0 beside them
    # (CI speed and bookkeeping change). Until then `gates` waited for the slowest shard (11.4 min
    # on run 40097725520, test_wip_curve's) and only then ran these one after another for 2.6-3.6
    # min, most of it the secret scan's test_verify re-run. Nothing here reads a shard artifact,
    # so nothing here waits. A job no required context depends on is advisory, so `gates` NEEDS this one and its
    # first step fails unless it succeeded: every check below still blocks the merge.
    runs-on: ubuntu-latest  # needs non-root + system-custody git
    timeout-minutes: 20
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24; Node 20 left runners 2026-09-23, #367)
        with:
          persist-credentials: false
          fetch-depth: 0  # vf-bench review-leg pins and the trailer check's PR range need full history
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 (Node 24, #367)
        with:
          python-version: "3.13"  # pin: CI 3.x was a moving target (G-03)
      - name: register setup-python's libpython with ldconfig (CodeBuild runners)
        # Subprocesses that drop LD_LIBRARY_PATH otherwise fail to load libpython.
        run: |
          if [ -n "${pythonLocation:-}" ] && [ -d "$pythonLocation/lib" ]; then
            SUDO=""; [ "$(id -u)" = 0 ] || SUDO=sudo
            echo "$pythonLocation/lib" | $SUDO tee /etc/ld.so.conf.d/zz-setup-python.conf >/dev/null
            $SUDO ldconfig
          fi
      - name: No co-author or tool-attribution trailers in this PR's commits
        # #628 / CONTRIBUTING.md "Commit and PR conventions": the rule was prose only, and 12 of
        # the last 200 commits on main broke it (2026-10-23 review, §5 Commit hygiene). Only the
        # PR's OWN commits (base..head) are read, so history already on main fails nothing.
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/check_trailers.py --base "$PR_BASE_SHA" --head "$PR_HEAD_SHA"
      - name: DECISIONS ledger validates (records since the human-source and class rules)
        # decisions.py check had no CI caller (2026-10-26 review). Records stamped before
        # 2026-09-24 predate the human-source, class and payload-v2 rules they would fail and are
        # history, not drafts: counted, never re-litigated. Every later record must pass.
        run: python3 runtime/scripts/decisions.py check --since 2026-09-24
      - name: Validate missions, playbooks, and evals
        run: python3 scripts/validate.py
      - name: CHANGELOG entries arrive as fragments, not as edits to the shared file
        # Every PR used to add its entry at the top of CHANGELOG.md's [Unreleased], so every merge
        # put every open PR into conflict (CI speed and bookkeeping change). An entry is now one
        # changelog.d/<slug>.md per change, which the release cut folds in. This fails a PR that
        # adds a top-level [Unreleased] entry to the shared file; the fragments' own shape is
        # checked by validate.py above, on every event.
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/changelog.py check --base "$PR_BASE_SHA"
      - name: The tests badge is the last release's own
        # The README labels it "at last release": between cuts it must be the badge at the cut
        # commit docs/releases.json names (PR #670 review); the cut writes a new one, and while
        # `preparing` is set it must be exactly that one, this tree's own count (W6-08).
        run: python3 scripts/gen-badges.py --check-last-release
      - name: Routing eval gate (description-based router)
        # #260: this is the gate, not the summary step below. It scores every
        # prompt in evals/routing.json against the REAL frontmatter descriptions
        # and fails the build under the threshold, so a description edit that
        # breaks routing cannot merge. Floor tracked in tests/test_evals.py
        # (ROUTING_MIN_SCORE); an error-level description collision fails here too.
        run: python3 scripts/eval.py run --suite routing --threshold 1.0
      - name: Check proof-evidence honesty
        run: python3 runtime/scripts/proof_status.py --check
      - name: Proof tiers bind to artifacts, not filenames
        # #259: a tier above doctrine-only must re-derive — a RUN: header, a
        # manifest inside the run's own directory, and an integrity inventory
        # re-hashed from git objects at the commit the header names. Needs the
        # full history the checkout step above fetches.
        run: python3 runtime/scripts/run_report.py
      - name: Bundle builds self-contained missions
        # #272 / docs/reviews/2026-09-10-review.md P2-18: a copy installer severs every ../../ reference.
        # --check builds the distribution tree in a temp dir and fails if any link
        # still leaves a mission directory.
        run: python3 scripts/bundle.py --check
      - name: Install the pinned CI tools (hashes, not version strings)
        # #301: these were three version strings with no checksum and no test —
        # "a version string with no hash and no test guarding it is a comment."
        # The step used to argue that hashing them needed a lockfile. That was
        # right; .github/ci-tools.lock IS the lockfile, hashes and all, and
        # --require-hashes makes a swapped artifact fail before it executes.
        run: |
          set -euo pipefail
          python3 -I -m pip install --quiet --require-hashes --only-binary :all: \
            -r .github/ci-tools.lock
          ruff --version
          agentskills --version
      - name: agentskills.io reference validator (skills-ref)
        # #263: the repo's own claims live under `metadata:` so the catalog is
        # installable through Anthropic's own paths, which hard-error on an
        # unexpected top-level key. This is the upstream validator saying so,
        # not our restatement of it.
        run: |
          set -euo pipefail
          for d in skills/*/; do
            agentskills validate "$d"
          done
      - name: Secret scan (gitleaks, pinned)
        # #270: doctrine in dispatch-lifecycle.md until now. Pinned by version
        # AND sha256 — a moved tag or a swapped asset fails the checksum before
        # anything executes. --redact so a finding never prints the secret.
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o gitleaks.tar.gz "$url"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP/gitleaks" gitleaks
          rm -f gitleaks.tar.gz
          "$RUNNER_TEMP/gitleaks/gitleaks" version
          gl="$RUNNER_TEMP/gitleaks/gitleaks"
          # Exercise the verifier's optional-scanner path as well as the built-in floor above.
          PATH="$RUNNER_TEMP/gitleaks:$PATH" python3 -I -m unittest discover -s tests -p test_verify.py
          # .gitleaksignore, not an allowlist: tests/test_decisions.py carries
          # credential-SHAPED fixtures (it exists to prove decisions.py refuses
          # credentials) and `detect` reads git history, so editing the file
          # cannot clear them. A path allowlist would waive the whole file --
          # measured, not assumed: gitleaks 8.30 ignores `condition = "AND"` and
          # a real key planted in that file went unflagged.
          #
          # It was a --baseline-path baseline until #300, which carried each
          # finding's commit message, author and e-mail beside it. A waiver needs
          # the finding's identity, not its content -- and 8.30.1 compares Email,
          # Author, Date, Message, Entropy, Description and Commit when matching a
          # baseline entry, so deleting those fields stops it suppressing anything.
          # .gitleaksignore takes the fingerprint alone, which is the whole waiver.
          #
          # `detect` reads history through `git log -p`, and git renders a file a
          # .gitattributes marks `-diff` (at the root or nested) as "Binary files
          # differ": a live key there went unreported (PR #718 re-attack, W6-03 class).
          # Both scans read attributes from the empty tree, never from the PR's.
          no_attributes="4b825dc642cb6eb9a060e54bf8d69288fbee4904"
          # That is not enough: git still renders a file it classifies as binary (a NUL byte in
          # it, or past core.bigFileThreshold) as "Binary files differ", and gitleaks cannot be
          # handed --text (PR #718 review round 5). `diff` SET in $GIT_DIR/info/attributes, which
          # outranks every attribute a tree can carry and which no PR can write, makes git diff
          # every path as text, a big file included; a `binary` or `-diff` line cannot undo it.
          every_path_text() (cd "$1" && f="$(git rev-parse --git-path info/attributes)" && mkdir -p "$(dirname "$f")" && printf '* diff\n' >> "$f")
          every_path_text .
          GIT_ATTR_SOURCE="$no_attributes" "$gl" detect --redact --no-banner --source .
          # An ignore file IS a waiver, so prove it waives only what it lists.
          # Plant a real-shaped key in the waived file itself, in a throwaway
          # clone, and require the same command to go red. The key is assembled
          # at runtime so this workflow file never contains a detectable literal.
          #
          # A .gitleaks.toml allowlist is a waiver too, and it waives by PATH, which
          # the fingerprint canary cannot see (2026-10-27 security audit, W6-03): an
          # allowlist for `^scripts/` left the planted key above reported and a real
          # one under scripts/ silent. So the same key also goes into a new file at
          # the root and under every top-level directory, and the report must name
          # every planted file. That proves no waiver covers a top-level directory
          # wholesale, nothing narrower: an allowlist for `^runtime/scripts/` still
          # passes it. What stops that is .gitleaks.toml on floor_guard's frozen
          # surface: a PR that edits it needs a recorded waiver before it can merge.
          # The clone also marks every path `-diff`, so a scan that honoured the
          # tree's attributes would miss every planted key and fail here.
          canary="$RUNNER_TEMP/canary"
          git clone --quiet . "$canary"
          every_path_text "$canary"
          printf 'CANARY = "%s%s"\n' 'AKIA' 'ZYXWVUTSRQPONMLK' >> "$canary/tests/test_decisions.py"
          planted=(tests/test_decisions.py)
          for dir in . $(git -C "$canary" ls-tree -d --name-only HEAD); do
            file="$dir/gitleaks-canary.txt"
            file="${file#./}"
            printf 'CANARY = "%s%s"\n' 'AKIA' 'ZYXWVUTSRQPONMLK' > "$canary/$file"
            planted+=("$file")
          done
          printf '* -diff\n' > "$canary/.gitattributes"
          # And a file git classifies as binary by its content (a NUL byte) and by attribute.
          printf 'x\000CANARY = "%s%s"\n' 'AKIA' 'ZYXWVUTSRQPONMLK' > "$canary/gitleaks-canary.dat"
          printf 'gitleaks-canary.dat binary\n' >> "$canary/.gitattributes"
          planted+=(gitleaks-canary.dat)
          git -C "$canary" add -A
          git -C "$canary" -c user.email=ci@local -c user.name=ci commit -qm canary
          if (cd "$canary" && GIT_ATTR_SOURCE="$no_attributes" "$gl" detect --redact --no-banner --source . --report-format json --report-path "$RUNNER_TEMP/canary.json"); then
            echo "::error::the secret scan passed a planted credential — a waiver (.gitleaksignore, a .gitleaks.toml allowlist or a .gitattributes) covers more than it lists"
            exit 1
          fi
          python3 -I - "$RUNNER_TEMP/canary.json" "${planted[@]}" <<'PY'
          import json, sys
          reported = {finding.get("File") for finding in json.load(open(sys.argv[1], encoding="utf-8"))}
          missed = [path for path in sys.argv[2:] if path not in reported]
          for path in missed:
              print(f"::error::the credential planted in {path} was not reported: a waiver covers that path")
          sys.exit(1 if missed else 0)
          PY
          echo "negative control: a planted credential is caught in the waived file, under every top-level directory and in a binary file, whatever the attributes say"
      - name: Ruff (syntax / undefined names)
        # Installed from the hashed lock above (#301), not re-resolved here.
        run: ruff check scripts runtime/scripts tests bench evals/demo
      - name: Publish the gate summary (proof rollup + routing score)
        # Observability only (#213): the numbers land in the run summary even
        # when a gate is red. The routing GATE is the step above; this one
        # swallows its exit code on purpose and can never fail the build. always(), so a red
        # check above still publishes; not before a checkout, since a summary of no tree reads
        # as a failure. It moved here from gates with the checks it summarizes.
        if: always() && steps.checkout.outcome == 'success'
        run: |
          {
            echo "## Catalog gates @ $(git rev-parse --short HEAD)"
            echo '```'
            python3 runtime/scripts/proof_status.py || echo "proof_status: FAILED"
            python3 scripts/eval.py run --suite routing || echo "routing eval: FAILED"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
  gates:
    # The required context. A need that fails SKIPS a plain dependent, and GitHub counts a
    # skipped required check as success, so `needs:` alone let a red shard merge (2026-10-23
    # review, P1-5: runs 39386063357 and 38533245355). always() runs gates whatever its needs
    # did, cancelled runs included, and the first step fails unless EVERY need succeeded —
    # failure, cancelled and skipped all fail it. vfbench and checks are needs for the same
    # reason: a job no required context depends on is advisory, however it is described. What
    # is left here is what needs the shards' own output: the D9 coverage combine.
    needs: [tests, floor, checks, vfbench, vfbench_replay]
    if: always()
    runs-on: ubuntu-latest  # combines coverage recorded on GitHub-hosted shards (path-sensitive)
    timeout-minutes: 10
    steps:
      - name: Every needed job succeeded (a failed, cancelled or skipped need fails gates)
        # toJSON(needs) carries every job in `needs:`, so a need added later is covered without
        # editing this step; an empty map fails too, rather than passing vacantly.
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 -I - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS_JSON"])
          bad = {job: (v or {}).get("result") for job, v in needs.items()
                 if (v or {}).get("result") != "success"}
          for job, result in sorted(bad.items()):
              print(f"::error::needed job '{job}' ended '{result}'; gates fails so the merge stays blocked")
          if not needs:
              print("::error::gates sees no needed jobs; refusing to pass vacantly")
          if bad or not needs:
              sys.exit(1)
          print("every needed job succeeded: " + ", ".join(sorted(needs)))
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24; Node 20 left runners 2026-09-23, #367)
        # Default depth: `coverage report` reads the sources at this commit, and no step left in
        # gates reads history (the trailer range and the review-leg pins moved to checks).
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 (Node 24, #367)
        with:
          python-version: "3.13"  # pin: CI 3.x was a moving target (G-03)
      - name: register setup-python's libpython with ldconfig (CodeBuild runners)
        # Subprocesses that drop LD_LIBRARY_PATH otherwise fail to load libpython.
        run: |
          if [ -n "${pythonLocation:-}" ] && [ -d "$pythonLocation/lib" ]; then
            SUDO=""; [ "$(id -u)" = 0 ] || SUDO=sudo
            echo "$pythonLocation/lib" | $SUDO tee /etc/ld.so.conf.d/zz-setup-python.conf >/dev/null
            $SUDO ldconfig
          fi
      - name: Install coverage from the hashed lock
        # Same lock + --require-hashes shape as every other job (#301): the combine below runs
        # the pinned tracer's own reader, never a re-resolved one.
        run: |
          set -euo pipefail
          python3 -I -m pip install --quiet --require-hashes --only-binary :all: \
            -r .github/ci-tools.lock
          coverage --version
      - name: Download the shard coverage data
        # merge-multiple: all six coverage-shard-* artifacts land in a directory of their own,
        # outside the checkout (W6-02), so a data file committed to the PR's tree is not read.
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0 (Node 24, #367; v4-v6 are Node 20, gone from runners 2026-09-23)
        with:
          pattern: coverage-shard-*
          merge-multiple: true
          path: ${{ runner.temp }}/coverage-shards
      - name: "Coverage floor (D9: line >= 80% on scripts + runtime/scripts)"
        # CONSTRAINTS.md D9, wired by the floor-it WIRE phase: the six matrix
        # jobs each traced their own shard (one parallel-mode data file per
        # shard, uploaded beside the job), and this step downloads all six,
        # combines, and reports on the committed .coveragerc (fail_under = 80,
        # ratchet-only). The gate is the same number over the same tests —
        # collection fanned out, the bar did not move. Installed from the
        # hashed lock (#301), not re-resolved here. gates NEEDS the
        # matrix and its first step fails on a red shard, so this step never
        # runs on partial data: the failed need — not a missing data file —
        # is what fails gates and blocks the merge. It combines exactly the six named shard
        # files, refusing a missing or an extra one, into a data file outside the checkout
        # (W6-02): the checkout-glob instance (a planted `.coverage.*` file) is closed. A test
        # can still add lines to the live tracer, which land in its shard's one legitimate file,
        # so coverage remains the PR's own measurement of itself, an accepted residual.
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/coverage-shards"
          want="$(printf 'coverage-shard-%s.data\n' 1 2 3 4 5 6)"
          have="$(ls -A "$dir" | LC_ALL=C sort)"
          if [ "$have" != "$want" ]; then
            echo "::error::the D9 floor reads exactly the six shard data files; $dir holds: $(printf '%s ' $have)"
            exit 1
          fi
          files=()
          for n in 1 2 3 4 5 6; do
            files+=("$dir/coverage-shard-$n.data")
          done
          export COVERAGE_FILE="$RUNNER_TEMP/coverage-combined"
          coverage combine "${files[@]}"
          coverage report
  vfbench:
    runs-on: ubuntu-latest  # needs non-root + system-custody git; stays GitHub-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24; Node 20 left runners 2026-09-23, #367)
        with:
          persist-credentials: false
          fetch-depth: 0  # a skipped trap is a hole in the score, not a pass (#412)
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 (Node 24, #367)
        with:
          python-version: "3.13"  # pin: CI 3.x was a moving target (G-03)
      - name: register setup-python's libpython with ldconfig (CodeBuild runners)
        # Subprocesses that drop LD_LIBRARY_PATH otherwise fail to load libpython.
        run: |
          if [ -n "${pythonLocation:-}" ] && [ -d "$pythonLocation/lib" ]; then
            SUDO=""; [ "$(id -u)" = 0 ] || SUDO=sudo
            echo "$pythonLocation/lib" | $SUDO tee /etc/ld.so.conf.d/zz-setup-python.conf >/dev/null
            $SUDO ldconfig
          fi
      - name: VF-Bench soundness gate (verify.py false-done must be 0)
        # #412: 0% false-done is a held property, not a historical fact. Fails on
        # corpus drift off VERSION+CANARY, any skipped trap, verify.py false_done
        # > 0, or any valid-control failure. RED means fix the verifier, never
        # the corpus. ~11s locally; stays in the PR gate by design, no nightly
        # waiver without an issue. One invocation and nothing else: release_check.py gate 3
        # counts only a step whose whole run: is that (PR #718 review). The runner's own
        # `bash -e -o pipefail` wraps it, and the step's duration is in the run log.
        run: python3 bench/vf-bench/gate.py
  vfbench_replay:
    # #601: the second environment. bench/vf-bench/replay-reference.json is a replay published from
    # a developer machine at a pinned revision; this job replays that revision under the same
    # protocol on the GitHub runner — a fresh export, a built environment — and fails on any
    # difference outside the host facts, the raw refusal text and wall time. The drill then proves
    # a deleted or edited corpus case or pinned fixture fails the replay, and the held-out protocol
    # is checked against the shipped corpus. The report uploads whatever happened, so a mismatch
    # can be read and compared (`replay.py compare`) against a local run of the same revision.
    runs-on: ubuntu-latest  # needs non-root + system-custody git; stays GitHub-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24; Node 20 left runners 2026-09-23, #367)
        with:
          persist-credentials: false
          fetch-depth: 0  # the pinned revision, and the real commits its traps pin, are history
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 (Node 24, #367)
        with:
          python-version: "3.13"  # pin: CI 3.x was a moving target (G-03)
      - name: register setup-python's libpython with ldconfig (CodeBuild runners)
        # Subprocesses that drop LD_LIBRARY_PATH otherwise fail to load libpython.
        run: |
          if [ -n "${pythonLocation:-}" ] && [ -d "$pythonLocation/lib" ]; then
            SUDO=""; [ "$(id -u)" = 0 ] || SUDO=sudo
            echo "$pythonLocation/lib" | $SUDO tee /etc/ld.so.conf.d/zz-setup-python.conf >/dev/null
            $SUDO ldconfig
          fi
      - name: Reproduce the published VF-Bench replay in this environment
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/vf-bench-replay"
          python3 bench/vf-bench/replay.py reproduce bench/vf-bench/replay-reference.json \
            --out "$RUNNER_TEMP/vf-bench-replay/report.json" \
            --summary "$RUNNER_TEMP/vf-bench-replay/summary.txt"
      - name: A deleted or edited corpus case or fixture fails the replay
        run: python3 bench/vf-bench/replay.py drill --rev HEAD
      - name: The held-out protocol is complete and pinned to the shipped corpus
        run: python3 bench/vf-bench/heldout.py validate
      - name: No commit carries a held-out v1 case or its canary
        # #601: held-out v1's digests are published, so every PR proves the solver's history holds
        # none of its cases (verbatim, reformatted, embedded) and not its canary. Full history:
        # the checkout above is fetch-depth 0, and a shallow one would fail as UNSCANNED.
        run: python3 bench/vf-bench/heldout.py check --digests bench/vf-bench/heldout-v1-digests.json --all-history
      - name: Publish the replay summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/vf-bench-replay/summary.txt" ]; then
            { echo '```'; cat "$RUNNER_TEMP/vf-bench-replay/summary.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload the replay report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0 (Node 24, #367)
        with:
          name: vf-bench-replay
          path: ${{ runner.temp }}/vf-bench-replay/
          if-no-files-found: error
          retention-days: 30
