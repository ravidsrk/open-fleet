name: product-package

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Verify product surface documentation coverage and anchors
        run: python3 -I scripts/extract_product_surface.py --check
      - name: Build wheel and verify fresh-venv CLI + MCP install
        run: python3 -I scripts/verify_wheel.py

  pr-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Dogfood reusable open-fleet-verify PR action
        uses: ./.github/actions/open-fleet-verify
        with:
          base-ref: origin/${{ github.base_ref }}
          run-floor-guard: "true"
          run-diff-scope: "true"
