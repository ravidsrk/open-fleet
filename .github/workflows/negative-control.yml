name: negative-control-demo

# #413: evals/demo/negative-control/ is the repo's executable elevator pitch, and demos rot faster
# than any other artifact. This job re-runs run.sh on every PR and fails on any drift
# between fresh output and the checked-in head-to-head.txt. Separate file (not a job in
# validate.yml) so the sibling vf-bench gate (#412) can land in either order conflict-free.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pinned-demo:
    runs-on: codebuild-gha-open-fleet-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24; same pin as validate.yml)
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 (Node 24, #367)
        with:
          python-version: "3.13"  # pin: CI 3.x was a moving target (G-03)
      - name: register setup-python's libpython with ldconfig (CodeBuild runners)
        # Subprocesses that drop LD_LIBRARY_PATH otherwise fail to load libpython.
        run: |
          if [ -n "${pythonLocation:-}" ] && [ -d "$pythonLocation/lib" ]; then
            SUDO=""; [ "$(id -u)" = 0 ] || SUDO=sudo
            echo "$pythonLocation/lib" | $SUDO tee /etc/ld.so.conf.d/zz-setup-python.conf >/dev/null
            $SUDO ldconfig
          fi
      - name: Re-run the demo and diff against pinned expectations
        run: |
          set -uo pipefail
          # The default shell is `bash -e`: with pipefail set, a red run.sh ended the step on this
          # pipeline and the diagnostic below never printed (2026-10-23 review, §5 CI). Suspend -e
          # for the pipeline alone and read PIPESTATUS before any other command resets it.
          set +e
          sh evals/demo/negative-control/run.sh 2>&1 | tee fresh-head-to-head.txt
          rc="${PIPESTATUS[0]}"
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error::evals/demo/negative-control/run.sh exited $rc — the demo itself is RED, not just drifted"
            exit 1
          fi
          # Line 1 carries a run timestamp by design (README integrity-inventory note);
          # normalize it on both sides so only real drift fails the build. The authority-custody
          # NOTEs are host-dependent (a git/gh/gitleaks in a user-writable dir, or a root uid,
          # turns them advisory) and are stripped exactly as tests/test_negative_control.py
          # strips them (#522).
          norm() { sed '1s/ — .*Z//' | grep -vE '^NOTE: (authority: advisory \((git|gh|gitleaks) at |redaction: gitleaks at )' || true; }
          if ! diff <(norm < evals/demo/negative-control/head-to-head.txt) <(norm < fresh-head-to-head.txt); then
            echo "::error::evals/demo/negative-control DRIFTED: fresh run.sh output differs from head-to-head.txt. To change expected output, change the demo AND explain why — see evals/demo/negative-control/README.md."
            exit 1
          fi
          echo "negative-control demo matches pinned expectations"
      - name: The demo runs as one command (release gate 3 reads this step)
        # release_check.py gate 3 counts only a step whose whole run: is one invocation (PR #718
        # review), and the step above needs a pipeline to capture the transcript it diffs. So
        # the demo (under a second) runs once more, alone. The step above stays first, so a red
        # demo still prints its "the demo itself is RED" diagnostic before anything else fails.
        run: sh evals/demo/negative-control/run.sh
