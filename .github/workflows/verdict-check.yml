# Verdict-derived merge check (#452): a GO verdict must bind the merge tip.
#
# AUTHORITY MOVED: a `pull_request_review` run loads THIS file from the PR, so a
# PR can rewrite the `verdict` job below. The required check is now the
# `verdict-gate` status posted by verdict-gate.yml, which GitHub loads from the
# default branch on `workflow_run`. This workflow is its trigger (the `relay`
# job always runs, so every review completes a run and wakes the gate); the
# `verdict` job stays as fast feedback in the PR's checks list.
#
# GitHub cannot express reviewed_sha == head_sha natively, so this workflow
# runs scripts/verdict_check.py against the PR: it passes iff a trusted review
# (APPROVED or COMMENTED, by OWNER / MEMBER / COLLABORATOR: the state proves
# nothing, since any account can approve on a public repository) carries
# "VERDICT: GO" with reviewed_sha == head, no later trusted NO-GO binds the head,
# and the PR changes no CI grader path (the workflows, actions, tool lock, gate
# scripts, root modules; scripts/verdict_check.py lists them) unless the owner
# opened it from a branch of this repository (2026-10-27 security audit, W6-01;
# PR #718 re-attack). The PR author's own GO counts
# only through one of those tiers (W6-06). A GO is a SHA binding, not
# independent review: required approvals stay branch protection's.
#
# The checker runs from the BASE commit, never from the PR: checking out the
# merge ref and running its scripts/verdict_check.py let a PR rewrite the very
# check that gates it. Only the base's copy of the script is fetched.
#
# Trigger design (measured, not assumed — PR #454/#455 post-mortem):
# GitHub branch protection treats a FAILED conclusion on the head SHA as
# sticky: a newer SUCCESS beside it does NOT clear it (only a re-run does).
# So this workflow evaluates only reviews that can actually satisfy the check:
#   - NO push triggers. A push is evaluated by absence: the new head has no
#     verdict runs, so the required check reads "expected" and blocks until a
#     fresh GO arrives. Fail-closed with zero poison.
#   - Review events only, and the job runs only for GO-marker reviews from a
#     trusted author (OWNER/MEMBER/COLLABORATOR, the script's trust tiers) or
#     from the PR author, whose self-GO the script refuses outside those tiers:
#     a fork author sees that refusal here. A review bot can re-review every push and any
#     stranger can COMMENT; evaluating those would fail-poison each head,
#     letting an untrusted reviewer grief the PR (PR #465 review, P1).
#   - Dismissals of GO-marker reviews evaluate (same gate): dismissing the GO
#     must actively re-block. Dismissals of anything else skip.
# Residual poison cases (both need the standard re-run escape hatch after the
# fresh GO): a GO review with a STALE reviewed_sha, and a GO dismissed then
# replaced on the same head (PR #465 review, P1 — accepted: a withdrawn
# verdict SHOULD take conscious re-acknowledgment to clear). Post a new review
# per verdict; editing a submitted review does not re-trigger evaluation.
name: verdict-check

on:
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read

jobs:
  relay:
    # Always runs: a completed run of this workflow is what wakes verdict-gate.yml.
    # It reads nothing and decides nothing — the gate re-derives every verdict.
    runs-on: codebuild-gha-open-fleet-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 5
    steps:
      - run: echo "review received; verdict-gate.yml evaluates it from the default branch"

  verdict:
    # GO-marker reviews from trusted authors only (PR #465 review, P1):
    # evaluating a stranger's GO marker would fail-poison the head.
    # But a SKIPPED job reports success to a required check, so every review this
    # `if:` declines satisfies a required `verdict` context: PR #611 merged on five
    # skipped `verdict` runs and no evaluated one (2026-10-23 review, P1-5). This
    # job cannot be the required check; docs/ops.md#merge-gate step 3 (#594) moves
    # protection to `verdict-gate`.
    if: >-
      contains(github.event.review.body, 'VERDICT: GO') &&
      (github.event.review.author_association == 'OWNER' ||
       github.event.review.author_association == 'MEMBER' ||
       github.event.review.author_association == 'COLLABORATOR' ||
       github.event.review.user.login == github.event.pull_request.user.login)
    runs-on: codebuild-gha-open-fleet-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 10
    steps:
      # The checker comes from the BASE sha, into its own path: the PR's tree is
      # never checked out, so a PR cannot rewrite the check that gates it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24; Node 20 left runners 2026-09-23, #367)
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base-checker
          sparse-checkout: scripts/verdict_check.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 (Node 24, #367)
        with:
          python-version: "3.13"  # pin: CI 3.x was a moving target (G-03)
      - name: register setup-python's libpython with ldconfig (CodeBuild runners)
        # Subprocesses that drop LD_LIBRARY_PATH otherwise fail to load libpython.
        run: |
          if [ -n "${pythonLocation:-}" ] && [ -d "$pythonLocation/lib" ]; then
            SUDO=""; [ "$(id -u)" = 0 ] || SUDO=sudo
            echo "$pythonLocation/lib" | $SUDO tee /etc/ld.so.conf.d/zz-setup-python.conf >/dev/null
            $SUDO ldconfig
          fi
      - name: GO verdict binds the merge tip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 base-checker/scripts/verdict_check.py --pr "$PR_NUMBER"
