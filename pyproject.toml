[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-fleet"
version = "1.1.0"
description = "Outcome-driven autonomous engineering fleets with independent SHA-bound verification, unified CLI, MCP server, and Mission Control UI."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
  { name = "Ravindra Kumar", email = "ravidsrk@gmail.com" },
]
keywords = [
  "open-fleet",
  "autonomous-agents",
  "coding-agents",
  "multi-agent",
  "mcp",
  "verification",
  "agentskills",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/ravidsrk/open-fleet"
Repository = "https://github.com/ravidsrk/open-fleet"
Documentation = "https://github.com/ravidsrk/open-fleet/blob/main/docs/README.md"
Issues = "https://github.com/ravidsrk/open-fleet/issues"

[project.scripts]
open-fleet = "open_fleet.cli:main"
open-fleet-mcp = "open_fleet.mcp_server:main"

[tool.setuptools.packages.find]
include = ["open_fleet*"]

[tool.setuptools.package-data]
open_fleet = ["ui_assets/*"]
